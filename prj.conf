# SPDX-License-Identifier: Apache-2.0
# LinkedSemi EC FW baseline (Leo / EHL_TCP_3L; ls101x_evb still builds)
#
# Hardware eSPI VW + Super I/O (0x2E/0x2F) + Host KBC (0x60/0x64).
# Host does not decode ACPI EC 0x62/0x66.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_FLASH=n
CONFIG_SPI=n
CONFIG_ESPI=y
CONFIG_ESPI_LPC=y
CONFIG_ESPI_LOG_LEVEL_INF=y
CONFIG_ESPIHUB_LOG_LEVEL=3
# Match ecfw-zephyr: SUS_ACK only from app warn handler (pwrplane/poc_pwrseq), not driver ISR.
CONFIG_ESPI_AUTOMATIC_WARNING_ACKNOWLEDGE=n
CONFIG_PECI=n
CONFIG_KCS=y
CONFIG_IPMI=n
CONFIG_ADC=n
CONFIG_USB_DEVICE_STACK=n

# EC features for PoC
CONFIG_PERIPHERAL_MANAGEMENT=y
CONFIG_PWRMGMT=y
CONFIG_SMCHOST=y
CONFIG_SMCHOST_EVENT_DRIVEN_TASK=y
CONFIG_SMCHOST_LOG_LEVEL=3
CONFIG_THERMAL_MANAGEMENT=n
CONFIG_POSTCODE_MANAGEMENT=n
CONFIG_OOBMNGR_SUPPORT=n
CONFIG_KSCAN_EC=n
CONFIG_PS2_KEYBOARD=n
CONFIG_PS2_MOUSE=n

CONFIG_BOARD_ID_IO_EXPANDER=n
# Stage B: power state follows real eSPI VW only (no simulated S5→S0)
CONFIG_LS_ECFW_POC_SIM_PWRSEQ=n
CONFIG_LS_ECFW_RELAXED_DEVICE_CHECK=y
CONFIG_GPIO_PCA95XX=n

CONFIG_WATCHDOG=n
CONFIG_THREAD_NAME=y
CONFIG_STACK_SENTINEL=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
